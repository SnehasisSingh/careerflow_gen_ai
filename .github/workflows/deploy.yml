name: Deploy CareerFlow AI to AWS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy AWS Resources
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Connect GitHub Actions to AWS using access keys
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3.1. Verify Claude API secret exists
      - name: Verify Claude API configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is missing from GitHub Secrets."
            exit 1
          fi
          echo "Claude API secret is configured."

      # 4. Verify AWS connection
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 5. Install AWS SAM CLI
      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      # 6. Validate infrastructure template
      - name: Validate SAM template
        run: sam validate --template-file template.yml

      # 7. Build the Lambda application
      - name: Build application
        run: sam build --template-file template.yml

      # 8. Deploy AWS resources
      - name: Deploy to AWS
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name careerflow-ai-dev \
            --region "${{ vars.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset